name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From /setup/health, or the Docker tag.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Docker, Cloudflare Workers, Other Node host, Local development]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets, emails, and tokens first.
      render: text
