name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests run the DB contract on libsql and on D1 (workerd via wrangler).
      - run: pnpm test
      - run: pnpm --filter @gitwork/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Builds and serves both runtimes; fails if libsql reaches the Worker bundle.
      - run: pnpm smoke
